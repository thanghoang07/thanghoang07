<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Go Backend API and PostgreSQL architecture illustration">
  <defs>
    <linearGradient id="bg-go" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#06281e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-go" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-go)"/>
  <!-- Terminal / Server Window -->
  <rect x="64" y="40" width="512" height="280" rx="14" fill="#0b111e" stroke="#10b981" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="64" y="40" width="512" height="34" rx="14" fill="#111c2d"/>
  <circle cx="88" cy="57" r="5" fill="#f87171"/>
  <circle cx="106" cy="57" r="5" fill="#fbbf24"/>
  <circle cx="124" cy="57" r="5" fill="#34d399"/>
  <text x="320" y="62" text-anchor="middle" fill="#6ee7b7" font-family="Oxanium, monospace, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GO BACKEND API · DOCKER · POSTGRESQL</text>

  <!-- Left Code / REST Endpoints -->
  <rect x="88" y="94" width="236" height="198" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="104" y="122" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">GET  /api/v1/health   200 OK</text>
  <text x="104" y="148" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="700">POST /api/v1/auth     201</text>
  <text x="104" y="174" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700">GET  /api/v1/orders   200 OK</text>
  <line x1="104" y1="194" x2="304" y2="194" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="104" y="220" fill="#94a3b8" font-family="monospace" font-size="11">goroutines: 64 · latency: 1.8ms</text>
  <text x="104" y="244" fill="#94a3b8" font-family="monospace" font-size="11">db_pool: active (PostgreSQL 16)</text>
  <rect x="104" y="260" width="140" height="12" rx="6" fill="url(#accent-go)"/>

  <!-- Right Architecture Nodes -->
  <rect x="356" y="94" width="192" height="54" rx="10" fill="#111c2d" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="452" y="119" text-anchor="middle" fill="#ffffff" font-family="Oxanium, monospace, sans-serif" font-size="14" font-weight="700">Go Fiber / Gin API</text>
  <text x="452" y="137" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="10">REST · JWT · Worker Pool</text>

  <line x1="452" y1="148" x2="452" y2="168" stroke="#34d399" stroke-width="2"/>

  <rect x="356" y="168" width="192" height="54" rx="10" fill="#111c2d" stroke="#10b981" stroke-width="1.5"/>
  <text x="452" y="193" text-anchor="middle" fill="#ffffff" font-family="Oxanium, monospace, sans-serif" font-size="14" font-weight="700">PostgreSQL Cluster</text>
  <text x="452" y="211" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">Indexed Queries · ACID</text>

  <line x1="452" y1="222" x2="452" y2="240" stroke="#a78bfa" stroke-width="2"/>

  <rect x="356" y="240" width="192" height="52" rx="10" fill="#111c2d" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="452" y="264" text-anchor="middle" fill="#ffffff" font-family="Oxanium, monospace, sans-serif" font-size="14" font-weight="700">Docker Container</text>
  <text x="452" y="281" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="10">Multi-stage Alpine Build</text>
</svg>
