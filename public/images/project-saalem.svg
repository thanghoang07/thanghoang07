<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="SAALEM HPT Enterprise Loan Origination System illustration">
  <defs>
    <linearGradient id="bg-saalem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="accent-saalem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-saalem)"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="128" y1="0" x2="128" y2="360"/>
    <line x1="256" y1="0" x2="256" y2="360"/>
    <line x1="384" y1="0" x2="384" y2="360"/>
    <line x1="512" y1="0" x2="512" y2="360"/>
  </g>
  <!-- Dashboard Window -->
  <rect x="70" y="42" width="500" height="276" rx="14" fill="#111827" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="70" y="42" width="500" height="36" rx="14" fill="#1e293b"/>
  <circle cx="94" cy="60" r="5" fill="#f87171"/>
  <circle cx="112" cy="60" r="5" fill="#fbbf24"/>
  <circle cx="130" cy="60" r="5" fill="#34d399"/>
  <text x="320" y="65" text-anchor="middle" fill="#93c5fd" font-family="'IBM Plex Mono', monospace, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">IBM BPM · LOAN ORIGINATION SYSTEM</text>
  <!-- BPM Workflow Nodes -->
  <rect x="104" y="106" width="110" height="58" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="159" y="132" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="12" font-weight="700">1. Application</text>
  <text x="159" y="150" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10">Intake &amp; KYC</text>

  <line x1="214" y1="135" x2="265" y2="135" stroke="url(#accent-saalem)" stroke-width="2.5"/>
  <polygon points="265,130 275,135 265,140" fill="#60a5fa"/>

  <rect x="275" y="106" width="110" height="58" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="330" y="132" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="12" font-weight="700">2. Credit Check</text>
  <text x="330" y="150" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10">Risk Scoring</text>

  <line x1="385" y1="135" x2="436" y2="135" stroke="url(#accent-saalem)" stroke-width="2.5"/>
  <polygon points="436,130 446,135 436,140" fill="#60a5fa"/>

  <rect x="446" y="106" width="94" height="58" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="493" y="132" text-anchor="middle" fill="#f9fafb" font-family="sans-serif" font-size="12" font-weight="700">3. Approval</text>
  <text x="493" y="150" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">Disburse</text>

  <!-- Data metrics bars -->
  <rect x="104" y="192" width="210" height="96" rx="8" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="120" y="212" width="120" height="10" rx="5" fill="url(#accent-saalem)"/>
  <rect x="120" y="234" width="165" height="10" rx="5" fill="#2563eb" fill-opacity="0.7"/>
  <rect x="120" y="256" width="95" height="10" rx="5" fill="#60a5fa" fill-opacity="0.6"/>

  <rect x="332" y="192" width="208" height="96" rx="8" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="436" y="232" text-anchor="middle" fill="#ffffff" font-family="'IBM Plex Mono', monospace, sans-serif" font-size="22" font-weight="700">SAALEM HPT</text>
  <text x="436" y="256" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12">BIDV · EXIMBANK LOS</text>
</svg>
