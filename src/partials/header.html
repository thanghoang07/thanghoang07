<!-- ─────────────────────────────────────
         HEADER / NAV
         ───────────────────────────────────── -->
<header class="ds-nav sticky top-0 z-30 py-4">
  <div class="ds-container ds-header-bar">

    <!-- Logo -->
    <a href="#main-content" class="ds-logo">
      Thang.
    </a>

    <!-- Desktop nav -->
    <nav aria-label="Main navigation" data-i18n-aria="nav-label" class="hidden md:flex ds-desktop-nav">
      <a href="#services" class="ds-nav__link" id="nav-services" data-i18n="nav-services">Services</a>
      <a href="#portfolio" class="ds-nav__link" id="nav-portfolio" data-i18n="nav-portfolio">Portfolio</a>
      <a href="#experience" class="ds-nav__link" id="nav-experience" data-i18n="nav-experience">Experience</a>
      <a href="#skills-tools" class="ds-nav__link" id="nav-skills" data-i18n="nav-skills">Skills</a>
      <a href="#contact" class="ds-nav__link" id="nav-contact" data-i18n="nav-contact">Contact</a>
    </nav>

    <!-- Controls -->
    <div class="ds-header-controls">
      <button type="button" id="toggle-theme" class="ds-btn ds-btn--icon" aria-label="Toggle light/dark theme" data-i18n-aria="toggle-theme" data-ripple>
        <i aria-hidden="true" class="fas fa-moon dark:hidden"></i>
        <i aria-hidden="true" class="fas fa-sun hidden dark:block"></i>
      </button>
      <button type="button" id="toggle-language" aria-label="Switch language" data-i18n-aria="toggle-language" class="ds-btn ds-btn--icon ds-lang-toggle" data-ripple>
        <span id="lang-vi-icon" class="ds-lang-badge" hidden>VI</span>
        <span id="lang-en-icon" class="ds-lang-badge">EN</span>
      </button>

      <!-- Mobile menu button -->
      <button type="button" id="mobile-menu-btn" hidden aria-expanded="false" aria-controls="mobile-menu" data-i18n-aria="menu-label" class="ds-btn ds-btn--icon md:hidden" aria-label="Menu">
        <i aria-hidden="true" class="fas fa-bars"></i>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="md:hidden ds-mobile-menu">
    <div class="ds-container ds-mobile-menu__inner">
      <a href="#services" class="ds-nav__link" data-i18n="nav-services">Services</a>
      <a href="#portfolio" class="ds-nav__link" data-i18n="nav-portfolio">Portfolio</a>
      <a href="#experience" class="ds-nav__link" data-i18n="nav-experience">Experience</a>
      <a href="#skills-tools" class="ds-nav__link" data-i18n="nav-skills">Skills</a>
      <a href="#contact" class="ds-nav__link" data-i18n="nav-contact">Contact</a>
    </div>
  </div>
