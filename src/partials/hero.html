         ───────────────────────────────────── -->
<section class="hero-section">
  <div class="ds-container hero-layout">

    <!-- Left: text -->
    <div>
      <span class="ds-eyebrow hero-fade-up" id="hero-mynameis" data-i18n="hero-mynameis">My name is</span>

      <h1 class="ds-h1 hero-heading">
        <span id="hero-name" class="ds-text-gradient">
          <span class="typing-text" data-text="Thang Hoang Duc.">Thang Hoang Duc.</span>
        </span>
      </h1>

      <p id="hero-intro" class="ds-body-lg hero-intro hero-fade-up-delay" data-i18n="hero-intro">Front-end developer with 5+ years of experience in UI development, passionate about creating modern web products and optimizing user experience.</p>

      <!-- Stats row -->
      <div class="hero-stats hero-fade-up-delay">
        <div class="ds-stat">
          <span class="ds-stat__number" data-count="5" data-suffix="+">5+</span>
          <span class="ds-stat__label"><span data-i18n="years">Years Exp.</span></span>
        </div>

        <div class="ds-stat">
          <span class="ds-stat__number" data-count="10" data-suffix="+">10+</span>
          <span class="ds-stat__label"><span data-i18n="projects">Projects</span></span>
        </div>

        <div class="ds-stat">
          <span class="ds-stat__number" data-count="3" data-suffix="">3</span>
          <span class="ds-stat__label"><span data-i18n="companies">Companies</span></span>
        </div>
      </div>

      <!-- CTA + socials -->
      <div class="hero-actions hero-fade-up-delay">
        <a href="#contact" class="ds-btn ds-btn--primary">
          <i aria-hidden="true" class="fas fa-paper-plane"></i><span data-i18n="get-touch">Get in touch</span>
        </a>
        <a href="#portfolio" class="ds-btn ds-btn--ghost">
          <span data-i18n="view-work">View work</span><i aria-hidden="true" class="fas fa-arrow-right ds-icon-sm"></i>
        </a>
      </div>

      <div class="hero-socials hero-fade-up-delay">
        <a href="https://linkedin.com/in/thanghoang07" target="_blank" rel="noopener" class="ds-btn ds-btn--icon"
          aria-label="LinkedIn"><i aria-hidden="true" class="fab fa-linkedin"></i></a>
        <a href="https://github.com/thanghoang07" target="_blank" rel="noopener" class="ds-btn ds-btn--icon"
          aria-label="GitHub"><i aria-hidden="true" class="fab fa-github"></i></a>
      </div>
    </div>

    <!-- Right: avatar -->
    <div class="hero-avatar hidden md:flex">
      <!-- Glow rings -->
      <div class="hero-orbit hero-orbit--outer" aria-hidden="true"></div>
      <div class="hero-orbit hero-orbit--inner" aria-hidden="true"></div>

      <div class="ds-glow-border hero-avatar-frame">
        <img src="/images/avatar.svg" width="200" height="200" decoding="async"
          alt="Thang Hoang Duc avatar" class="hero-avatar-img">
      </div>

      <!-- Floating chips around avatar -->
      <div class="glass-card hero-chip hero-chip--1">
        <i aria-hidden="true" class="fas fa-code"></i>IBM BPM Dev
      </div>
      <div class="glass-card hero-chip hero-chip--2">
        <i aria-hidden="true" class="fas fa-mobile-alt"></i>Mobile Dev
      </div>
      <div class="glass-card hero-chip hero-chip--3">
        <i aria-hidden="true" class="fas fa-microchip"></i>IoT Dev
      </div>
    </div>
  </div>
</section>
