<!-- ─────────────────────────────────────
         CERTIFICATIONS
         ───────────────────────────────────── -->
<section id="certifications" class="ds-section">
  <div class="ds-container">
    <div class="ds-section-header ds-section-header--center ds-reveal">
      <span class="ds-eyebrow" id="certifications-subtitle" data-i18n="cert-subtitle">Certifications</span>
      <h2 class="ds-h2" id="certifications-title" data-i18n="cert-title">Certifications</h2>
    </div>

    <div class="card-grid certification-grid">
      <div class="glass-card ds-cert-card ds-reveal ds-stagger-1">
        <div class="ds-cert-card__icon">
          <i aria-hidden="true" class="fas fa-certificate"></i>
        </div>
        <div>
          <div id="cert-xamarin-title" class="ds-cert-card__title" data-i18n="cert-xamarin-title">Xamarin Cross-Platform Mobile Apps Development</div>
          <div id="cert-xamarin-date" class="ds-cert-card__date" data-i18n="cert-xamarin-date">05/2018</div>
        </div>
      </div>

      <div class="glass-card ds-cert-card ds-reveal ds-stagger-2">
        <div class="ds-cert-card__icon">
          <i aria-hidden="true" class="fas fa-award"></i>
        </div>
        <div>
          <div id="cert-flutter-title" class="ds-cert-card__title" data-i18n="cert-flutter-title">Flutter Development</div>
          <div id="cert-flutter-date" class="ds-cert-card__date" data-i18n="cert-flutter-date">01/2023</div>
        </div>
      </div>
    </div>
  </div>
</section>
