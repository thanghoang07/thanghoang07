  <!-- Critical inline styles: loader + base body override -->
  <style>
    /* â”€â”€ Loader â”€â”€ */
    .page-loader {
      position: fixed;
      inset: 0;
      background: var(--c-bg, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      z-index: 9999;
      transition: opacity .6s ease, visibility .6s ease
    }

    .page-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none
    }

    .loader-logo {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      background: none;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: _lglow 2s ease-in-out infinite alternate
    }

    @keyframes _lglow {
      0% {
        opacity: .8;
        transform: scale(1)
      }

      100% {
        opacity: 1;
        transform: scale(1.04)
      }
    }

    .loader-spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #e0e0e0;
      border-top-color: #000000;
      border-right-color: #000000;
      animation: _lspin .9s linear infinite
    }

    @keyframes _lspin {
      to {
        transform: rotate(360deg)
      }
    }

    .loader-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #000000;
      animation: _lpulse 1.5s ease-in-out infinite
    }

    @keyframes _lpulse {

      0%,
      100% {
        opacity: .35
      }

      50% {
        opacity: .75
      }
    }

    /* â”€â”€ Typing cursor â”€â”€ */
    .typing-cursor {
      display: inline-block;
      width: 3px;
      background: currentColor;
      animation: _blink 1s infinite;
      margin-left: 2px;
      vertical-align: middle
    }

    @keyframes _blink {

      0%,
      50% {
        opacity: 1
      }

      51%,
      100% {
        opacity: 0
      }
    }

    /* â”€â”€ Hero entrance â”€â”€ */
    .hero-fade-up {
      opacity: 0;
      transform: translateY(28px);
      animation: _hfu .8s .3s ease-out forwards
    }

    .hero-fade-up-delay {
      opacity: 0;
      transform: translateY(28px);
      animation: _hfu .8s .7s ease-out forwards
    }

    @keyframes _hfu {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* â”€â”€ Main content hidden until loaded â”€â”€ */
    body:not(.loaded) .main-content {
      opacity: 0
    }

    .main-content {
      opacity: 1;
      transition: opacity .4s ease
    }

    /* skeleton */
    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, .04) 25%, rgba(255, 255, 255, .08) 50%, rgba(255, 255, 255, .04) 75%);
      background-size: 200% 100%;
      animation: _sk 1.5s infinite
    }

    @keyframes _sk {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }
  </style>
</head>

  <!-- Tab switching script (inline - no dependency) -->
  <script>
    function switchTab(company) {
      ['hpt', 'tk25', 'nbn', 'devup'].forEach(c => {
        const isActive = c === company;
        const btn = document.getElementById('tab-' + c);
        const panel = document.getElementById('content-' + c);
        if (btn) {
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', String(isActive));
          btn.setAttribute('tabindex', isActive ? '0' : '-1');
        }
        if (panel) {
          panel.classList.toggle('hidden', !isActive);
          panel.setAttribute('aria-hidden', String(!isActive));
        }
      });
    }
    // Mobile menu
    const mobileMenu = document.getElementById('mobile-menu');
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      if (!mobileMenu) return;
      const opening = mobileMenu.classList.contains('hidden');
      if (opening) {
        mobileMenu.classList.remove('hidden');
        requestAnimationFrame(() => mobileMenu.classList.add('is-open'));
      } else {
        mobileMenu.classList.remove('is-open');
        setTimeout(() => mobileMenu.classList.add('hidden'), 180);
      }
    });
    document.querySelectorAll('#mobile-menu .ds-nav__link').forEach((link) => {
      link.addEventListener('click', () => {
        mobileMenu?.classList.remove('is-open');
        setTimeout(() => mobileMenu?.classList.add('hidden'), 180);
      });
    });
    // Back to top visibility
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('back-to-top');
      if (btn) btn.classList.toggle('show', window.scrollY > 300);
    }, { passive: true });
    document.getElementById('back-to-top')?.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
